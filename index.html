<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Copa Bravex</title>

  <!-- Icono real para "Añadir a pantalla de inicio" en iOS -->
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/jgoyeneche1/bravex_assets/main/apple-touch-icon.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bravex" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#065f46" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background-image: url('https://raw.githubusercontent.com/jgoyeneche1/bravex_assets/main/splash-bienvenida.jpg');
      background-size: cover;
      background-position: center;
      font-family: -apple-system, sans-serif;
    }
    #bienvenida {
      position: fixed; inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 26px 18px 34px;
      text-align: center;
    }
    .frase {
      color: #fff; font-style: italic; font-weight: 500; font-size: 13px; line-height: 1.55;
      max-width: 85%; margin-top: 6px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.55), 0 1px 10px rgba(0,0,0,0.35);
    }
    .bienvenida-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      margin-bottom: 10px;
    }
    .sub {
      color: #fff; font-weight: 600; font-size: 15px; letter-spacing: 0.2px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.55), 0 1px 10px rgba(0,0,0,0.35);
    }
    .boton {
      display: inline-block;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.55);
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 13px 36px;
      border-radius: 999px;
      text-decoration: none;
      font-family: inherit;
    }
    #appFrame {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="bienvenida">
    <div class="frase">“La competitividad característica fundamental de cualquier Bravo y jamás deberá anteponerse al disfrute, buen ambiente y buen humor de la partida.”</div>

    <div class="bienvenida-wrap">
      <div class="sub">Bienvenido a la Bravex Cup</div>
      <button class="boton" id="btnIniciar">Iniciar</button>
    </div>
  </div>

  <!--
    En vez de navegar a script.google.com (eso cambia de dominio y hace
    que iOS muestre la barra de Safari), la app real se carga adentro de
    este iframe, sin salir nunca del dominio de esta página -- por eso
    se mantiene la vista sin barras. Funciona porque Code.gs ya tiene
    setXFrameOptionsMode(ALLOWALL). El "?inicio=1" evita que se repita
    la bienvenida adentro de la app.
  -->
  <!-- clipboard-write/web-share: para que "Compartir"/"Copiar imagen" de
       la tarjeta del Match entre Amigos funcionen adentro del iframe
       (si el navegador del teléfono los soporta). -->
  <iframe id="appFrame" allow="clipboard-write; web-share"></iframe>

  <script>
    // ---------------------------------------------------------------
    // Sesión "recordada" (nombre + PIN) para que la app no pida
    // credenciales cada vez que se abre. Se guarda ACÁ (index.html en
    // github.io) y no adentro del iframe de la app, porque Safari trata
    // el contenido de script.google.com dentro de ese iframe como
    // almacenamiento "de terceros" y no lo deja persistir de forma
    // confiable entre aperturas -- esta página, en cambio, es de
    // "primera parte" (es el dominio de arriba de todo) y no tiene ese
    // problema. Se le pasa a la app por parámetros de URL en cada
    // apertura; el servidor (Code.gs) vuelve a verificar nombre+PIN
    // antes de confiar en nada.
    var LS_SESION_ = 'bravex_sesion';

    function leerSesionGuardada_() {
      try { return JSON.parse(localStorage.getItem(LS_SESION_) || 'null'); }
      catch (e) { return null; }
    }

    // Id propio de ESTE teléfono (opaco, no es un dato personal -- solo
    // un string al azar) -- se genera una sola vez y se guarda acá
    // (primera parte, igual que la sesión de arriba). La app lo usa
    // nada más para el aviso (no bloqueo) de "este nombre se usó hace
    // poco desde otro teléfono" -- así reabrir la app en el mismo
    // teléfono nunca dispara ese aviso, solo cuando cambia el teléfono.
    var LS_DEVICE_ = 'bravex_device_id';

    function obtenerDeviceId_() {
      try {
        var id = localStorage.getItem(LS_DEVICE_);
        if (!id) {
          id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
            : ('dev-' + Date.now() + '-' + Math.random().toString(36).slice(2));
          localStorage.setItem(LS_DEVICE_, id);
        }
        return id;
      } catch (e) {
        return null;
      }
    }

    // La app (adentro del iframe) nos avisa por postMessage cuando
    // alguien inicia o cierra sesión, para que quede guardada acá.
    window.addEventListener('message', function (ev) {
      var d = ev.data;
      if (!d || typeof d !== 'object') return;
      if (d.tipo === 'bravex_guardar_sesion' && d.nombre && d.pin) {
        try { localStorage.setItem(LS_SESION_, JSON.stringify({ nombre: d.nombre, pin: d.pin })); } catch (e) {}
      } else if (d.tipo === 'bravex_borrar_sesion') {
        try { localStorage.removeItem(LS_SESION_); } catch (e) {}
      }
    });

    document.getElementById('btnIniciar').addEventListener('click', function () {
      var frame = document.getElementById('appFrame');
      // "&_v=" con la hora exacta obliga a pedir la página de nuevo cada
      // vez (evita que el teléfono/iOS se quede sirviendo una copia
      // vieja cacheada del iframe cuando se publica una versión nueva en
      // Apps Script).
      var url = "https://script.google.com/macros/s/AKfycbwu7nFxS-1XHSXyEUvp4UwM-db_lVHZLrK0b6yl3zIH3PkyWiWJtrr4w2DT0X0g8vjR3g/exec?inicio=1&_v=" + Date.now();
      var sesion = leerSesionGuardada_();
      if (sesion && sesion.nombre && sesion.pin) {
        url += "&u=" + encodeURIComponent(sesion.nombre) + "&p=" + encodeURIComponent(sesion.pin);
      }
      var deviceId = obtenerDeviceId_();
      if (deviceId) { url += "&d=" + encodeURIComponent(deviceId); }
      frame.src = url;
      frame.style.display = 'block';
      document.getElementById('bienvenida').style.display = 'none';
    });
  </script>
</body>
</html>
