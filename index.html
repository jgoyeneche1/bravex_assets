<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Copa Bravex</title>

  <!-- Icono real para "Añadir a pantalla de inicio" en iOS -->
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/jgoyeneche1/bravex_assets/main/apple-touch-icon.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bravex" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#065f46" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background-image: url('https://raw.githubusercontent.com/jgoyeneche1/bravex_assets/main/splash-bienvenida.jpg');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 26px 18px 34px;
      text-align: center;
      font-family: -apple-system, sans-serif;
    }
    .frase {
      color: #fff; font-style: italic; font-weight: 600; font-size: 13px; line-height: 1.5;
      background: rgba(6,78,59,0.6); padding: 12px 16px; border-radius: 12px; max-width: 92%;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
    .bienvenida-wrap {
      background: rgba(6,78,59,0.6); padding: 10px 18px; border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .titulo { color: #fff; font-weight: 900; font-size: 18px; letter-spacing: 1px; }
    .sub { color: #a3e635; font-weight: bold; font-size: 12px; margin-top: 2px; }
    .boton {
      display: inline-block;
      background: #ffffff;
      color: #064e3b;
      font-weight: bold;
      font-size: 16px;
      padding: 12px 30px;
      border-radius: 12px;
      text-decoration: none;
      border: none;
      font-family: inherit;
    }
    #appFrame {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="bienvenida">
    <div class="frase">“La competitividad característica fundamental de cualquier Bravo y jamás deberá anteponerse al disfrute, buen ambiente y buen humor de la partida.”</div>

    <div class="bienvenida-wrap">
      <div>
        <div class="titulo">COPA BRAVEX</div>
        <div class="sub">¡Bienvenido a la Bravex Cup!</div>
      </div>
      <button class="boton" id="btnIniciar">Iniciar ▶</button>
    </div>
  </div>

  <!--
    En vez de navegar a script.google.com (eso cambia de dominio y hace
    que iOS muestre la barra de Safari), la app real se carga adentro de
    este iframe, sin salir nunca del dominio de esta página -- por eso
    se mantiene la vista sin barras. Funciona porque Code.gs ya tiene
    setXFrameOptionsMode(ALLOWALL). El "?inicio=1" evita que se repita
    la bienvenida adentro de la app.
  -->
  <iframe id="appFrame"></iframe>

  <script>
    document.getElementById('btnIniciar').addEventListener('click', function () {
      var frame = document.getElementById('appFrame');
      frame.src = "https://script.google.com/macros/s/AKfycbwu7nFxS-1XHSXyEUvp4UwM-db_lVHZLrK0b6yl3zIH3PkyWiWJtrr4w2DT0X0g8vjR3g/exec?inicio=1";
      frame.style.display = 'block';
      document.getElementById('bienvenida').style.display = 'none';
    });
  </script>
</body>
</html>
