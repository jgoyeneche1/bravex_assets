<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Copa Bravex</title>

  <!-- Icono real para "Añadir a pantalla de inicio" en iOS -->
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/jgoyeneche1/bravex_assets/main/apple-touch-icon.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bravex" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#065f46" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #064e3b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, sans-serif;
      color: #fff;
      gap: 22px;
    }
    .titulo { text-align: center; font-weight: bold; font-size: 15px; opacity: 0.85; }
    .boton {
      display: inline-block;
      background: #ffffff;
      color: #064e3b;
      font-weight: bold;
      font-size: 17px;
      padding: 14px 28px;
      border-radius: 12px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="titulo">Copa Bravex</div>

  <!--
    IMPORTANTE: esta página YA NO redirige sola.
    Antes redirigía automáticamente al cargar (window.location.replace),
    y eso hacía que cuando el usuario tocaba "Compartir > Añadir a
    pantalla de inicio", Safari ya había saltado a la página de Apps
    Script (sin apple-touch-icon), así que iOS seguía leyendo la
    página equivocada. Ahora la navegación es manual (un toque), para
    que esta página nunca se mueva sola y "Añadir a pantalla de
    inicio" siempre vea el <head> correcto con el ícono real.
  -->
  <a class="boton" href="https://script.google.com/macros/s/AKfycbwu7nFxS-1XHSXyEUvp4UwM-db_lVHZLrK0b6yl3zIH3PkyWiWJtrr4w2DT0X0g8vjR3g/exec">
    Abrir Copa Bravex ▶
  </a>
</body>
</html>
