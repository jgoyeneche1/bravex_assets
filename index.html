<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Copa Bravex</title>

  <!-- Icono real para "Añadir a pantalla de inicio" en iOS -->
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/jgoyeneche1/bravex_assets/main/apple-touch-icon.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bravex" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#065f46" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background-image: url('https://raw.githubusercontent.com/jgoyeneche1/bravex_assets/main/splash-bienvenida.jpg');
      background-size: cover;
      background-position: center;
      font-family: -apple-system, sans-serif;
    }
    #bienvenida {
      position: fixed; inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 26px 18px 34px;
      text-align: center;
    }
    .frase {
      color: #fff; font-style: italic; font-weight: 500; font-size: 13px; line-height: 1.55;
      max-width: 85%; margin-top: 6px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.55), 0 1px 10px rgba(0,0,0,0.35);
    }
    .bienvenida-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      margin-bottom: 10px;
    }
    .sub {
      color: #fff; font-weight: 600; font-size: 15px; letter-spacing: 0.2px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.55), 0 1px 10px rgba(0,0,0,0.35);
    }
    .boton {
      display: inline-block;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.55);
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 13px 36px;
      border-radius: 999px;
      text-decoration: none;
      font-family: inherit;
    }
    #appFrame {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="bienvenida">
    <div class="frase">“La competitividad característica fundamental de cualquier Bravo y jamás deberá anteponerse al disfrute, buen ambiente y buen humor de la partida.”</div>

    <div class="bienvenida-wrap">
      <div class="sub">Bienvenido a la Bravex Cup</div>
      <button class="boton" id="btnIniciar">Iniciar</button>
    </div>
  </div>

  <!--
    En vez de navegar a script.google.com (eso cambia de dominio y hace
    que iOS muestre la barra de Safari), la app real se carga adentro de
    este iframe, sin salir nunca del dominio de esta página -- por eso
    se mantiene la vista sin barras. Funciona porque Code.gs ya tiene
    setXFrameOptionsMode(ALLOWALL). El "?inicio=1" evita que se repita
    la bienvenida adentro de la app.
  -->
  <iframe id="appFrame"></iframe>

  <script>
    document.getElementById('btnIniciar').addEventListener('click', function () {
      var frame = document.getElementById('appFrame');
      // "&_v=" con la hora exacta obliga a pedir la página de nuevo cada
      // vez (evita que el teléfono/iOS se quede sirviendo una copia
      // vieja cacheada del iframe cuando se publica una versión nueva en
      // Apps Script).
      frame.src = "https://script.google.com/macros/s/AKfycbwu7nFxS-1XHSXyEUvp4UwM-db_lVHZLrK0b6yl3zIH3PkyWiWJtrr4w2DT0X0g8vjR3g/exec?inicio=1&_v=" + Date.now();
      frame.style.display = 'block';
      document.getElementById('bienvenida').style.display = 'none';
    });
  </script>
</body>
</html>
